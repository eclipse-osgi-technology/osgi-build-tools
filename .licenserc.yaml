header:
  license:
    spdx-id: EPL-2.0
    copyright-owner: Contributors to the Eclipse Foundation
    content: |
      Copyright (c) 2024 Contributors to the Eclipse Foundation.

      This program and the accompanying materials are made
      available under the terms of the Eclipse Public License 2.0
      which is available at https://www.eclipse.org/legal/epl-2.0/
      SPDX-License-Identifier: EPL-2.0

      Contributors:

    # EPL-2.0, or Apache-2.0 for the code from the OSGi specification project
    pattern: |
      (This program and the accompanying materials are made
      available under the terms of the Eclipse Public License 2.0
      which is available at https://www.eclipse.org/legal/epl-2.0/|Licensed under the Apache License, Version 2.0)

  paths-ignore:
    - 'dist'
    - 'licenses'
    - '**/*.md'
    - '**/*.MD'
    - '**/.keep'
    - '**/*.jetproperties'
    - '**/*.javajet'
    - '**/*.javajetinc'
    - '**/*.json'
    - '**/*.csv'
    - '**/*.properties'
    - '**/*.maven'
    - '**/*.html'
    - '**/.classpath'
    - '**/.editorconfig'
    - 'LICENSE'
    - 'NOTICE'
    - '.gitattributes'
    - '.github/**'
    - '.gitignore'
    - '.licenserc.yaml'
    - '.readthedocs.yaml'
    - '.mvn/maven.config'
    - '**/.project'
    - '**/*.prefs'
    - 'license.templates'
    - '**/logback-test.xml'
    - '**/*.svg'
    # third-party: docbook-xsl with its webhelp script, highlight.js, the fonts
    - '**/docbook/docbook-xsl/**'
    - '**/html-resources/js/main.js'
    - '**/html-resources/js/highlight.pack.js'
    - '**/html-resources/css/github.css'
    - '**/src/main/resources/fonts/**'
    - '**/THIRD-PARTY.txt'
    # taken over from the OSGi specification build, which has no headers there
    - '**/docbook/xsl/custom-fo.xsl'
    - '**/docbook/xsl/custom-html.xsl'
    - '**/docbook/xsl/custom-html-common.xsl'
    - '**/docbook/xsl/custom-profile.xsl'
    - '**/docbook/xsl/javadoc2docbook.xsl'
    - '**/docbook/xsl/html-resources/css/custom.css'
    - '**/fop/fop-osgi.xconf'
    # schemas of the tests: their prolog is what the tests check
    - '**/test-projects/*/xmlns/**'

  comment: always
