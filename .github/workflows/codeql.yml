# CodeQL logic lives in eclipse-osgi-technology/.github (reusable workflow).
name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * 3'
permissions:
  contents: read
jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
    uses: eclipse-osgi-technology/.github/.github/workflows/codeql.yml@main
